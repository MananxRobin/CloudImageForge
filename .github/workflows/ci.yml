name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONPATH: ${{ github.workspace }}/src

jobs:
  unit:
    name: unit (pytest / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    steps:
      - uses: actions/checkout@v4
      - name: Install pytest from Ubuntu
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pytest python3-pytest-cov
          echo "${{ github.workspace }}/bin" >> "$GITHUB_PATH"
      - name: Unit tests
        run: python3 -m pytest tests/unit --cov=cloudimageforge --cov-report=term-missing

  functional:
    name: functional (pytest)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install pytest from Ubuntu
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pytest
          echo "${{ github.workspace }}/bin" >> "$GITHUB_PATH"
      - name: Functional pipeline tests
        run: python3 -m pytest tests/functional -m functional

  autopkgtest:
    name: autopkgtest
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install pytest and autopkgtest
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pytest autopkgtest
          echo "${{ github.workspace }}/bin" >> "$GITHUB_PATH"
          command -v autopkgtest
      - name: Run Debian autopkgtest scripts
        run: |
          chmod +x debian/tests/smoke debian/tests/staging-fallback
          debian/tests/smoke
          debian/tests/staging-fallback

  sysadmin-check:
    name: sysadmin boot check (LXD/QEMU + apt)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pytest qemu-system-x86 qemu-utils
          echo "${{ github.workspace }}/bin" >> "$GITHUB_PATH"
      - name: Catch broken apt source and host-only dependency
        run: bash scripts/sysadmin-check.sh
      - name: LXD/QEMU command dry-run (guest boot path)
        run: |
          ciforge bootcheck --release jammy --backend lxd --dry-run
          ciforge bootcheck --release noble --backend qemu --dry-run
          command -v qemu-system-x86_64
          qemu-system-x86_64 --version | head -n1

  boot-lxd:
    name: boot LXD (apt-get update)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install pytest
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pytest
          echo "${{ github.workspace }}/bin" >> "$GITHUB_PATH"
      - name: Setup LXD
        uses: canonical/setup-lxd@v1
        with:
          channel: 5.21/stable
      - name: Boot jammy and noble, catch broken apt
        run: bash scripts/ci-boot-lxd.sh
      - name: Live LXD tests
        run: python3 -m pytest tests/live -m live

  boot-qemu:
    name: boot QEMU (cloud image + apt)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install QEMU and seed tools
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 qemu-utils genisoimage cloud-image-utils ovmf
          echo "${{ github.workspace }}/bin" >> "$GITHUB_PATH"
      - name: Cache Ubuntu cloud images
        uses: actions/cache@v4
        with:
          path: ~/.cache/cloudimageforge/images
          key: jammy-qemu-cloudimg-${{ runner.os }}
      - name: Pull image, boot, catch broken apt
        run: bash scripts/ci-boot-qemu.sh

  sbuild:
    name: sbuild unshare (noble)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install sbuild
        run: |
          sudo apt-get update
          sudo apt-get install -y sbuild mmdebstrap uidmap dpkg-dev debhelper
          echo "${{ github.workspace }}/bin" >> "$GITHUB_PATH"
      - name: Cache sbuild chroots
        uses: actions/cache@v4
        with:
          path: ~/.cache/sbuild
          key: sbuild-noble-universe-${{ runner.os }}
      - name: Build ciforge-hello via sbuild
        run: bash scripts/ci-sbuild.sh

  pbuilder:
    name: pbuilder (noble)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Install pbuilder
        run: |
          sudo apt-get update
          sudo apt-get install -y pbuilder debootstrap dpkg-dev debhelper eatmydata
          echo "${{ github.workspace }}/bin" >> "$GITHUB_PATH"
      - name: Cache pbuilder base
        uses: actions/cache@v4
        with:
          path: ~/.cache/cloudimageforge/pbuilder
          key: pbuilder-noble-${{ runner.os }}
      - name: Build ciforge-hello via pbuilder
        run: bash scripts/ci-pbuilder.sh

  debian-source:
    name: Debian source package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build native .dsc
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev debhelper dh-python python3-all python3-setuptools python3-pytest
          bash scripts/build-source-package.sh dist
          test -f dist/cloudimageforge_0.1.0.dsc

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  github:
    name: GitHub Release (Debian source)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build Debian source package
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev debhelper dh-python python3-all python3-setuptools python3-pytest
          bash scripts/build-source-package.sh dist
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.dsc
            dist/*.tar.xz
            dist/*.changes

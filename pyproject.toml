[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cloudimageforge"
version = "0.1.0"
description = "Ubuntu cloud image and deb packaging pipeline for 22.04 and 24.04"
readme = "README.md"
license = {text = "GPL-3.0-or-later"}
requires-python = ">=3.10"
authors = [
    {name = "Manan", email = "mananambaliya7010@gmail.com"},
]
keywords = [
    "ubuntu",
    "cloud-images",
    "debian",
    "dpkg",
    "sbuild",
    "pbuilder",
    "launchpad",
    "apt",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Systems Administration",
]
dependencies = []

[project.scripts]
ciforge = "cloudimageforge.cli:main"

[project.urls]
Homepage = "https://github.com/MananxRobin/CloudImageForge"
Documentation = "https://github.com/MananxRobin/CloudImageForge#readme"
Issues = "https://github.com/MananxRobin/CloudImageForge/issues"
Source = "https://github.com/MananxRobin/CloudImageForge"
Changelog = "https://github.com/MananxRobin/CloudImageForge/releases"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cloudimageforge = ["data/*.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "functional: slower pipeline tests using local fixtures",
    "live: tests that hit Ubuntu/Launchpad network APIs",
]

[tool.coverage.run]
source = ["cloudimageforge"]
branch = true
